# Save this file in your repo as:  .github/workflows/transcribe.yml
#
# What it does: whenever reels.txt changes on main (or you press "Run workflow"),
#   1. plan       splits reels.txt into small chunks (8 reels each by default)
#   2. transcribe runs one job PER CHUNK, all in parallel (each job has its own 6-hour limit,
#                 so a long list can no longer hit the limit, and each job has its own IP)
#   3. merge      joins the chunks in order and commits transcription_<model name>.txt to main
# Uses insta.py. No login / cookies.

name: Transcribe reels

on:
  push:
    branches: [main]
    paths: [reels.txt]
  workflow_dispatch:
    inputs:
      model:
        description: Whisper model (large-v3 = best accuracy; q5_0 = same quality, half the memory; turbo = faster)
        type: choice
        default: ggml-large-v3
        options:
          - ggml-large-v3
          - ggml-large-v3-q5_0
          - ggml-large-v3-turbo
      chunk_size:
        description: Reels per parallel job (smaller = faster overall, but more jobs)
        type: string
        default: "8"

permissions:
  contents: write

# one run at a time, so two runs never fight over the output file
concurrency:
  group: transcribe
  cancel-in-progress: false

env:
  WHISPER_MODEL: ${{ inputs.model || 'ggml-large-v3' }}
  OUTPUT_FILE: transcription_${{ inputs.model || 'ggml-large-v3' }}.txt
  CHUNK_SIZE: ${{ inputs.chunk_size || '8' }}
  WHISPER_CPP_REF: v1.7.5

jobs:
  # ---------------------------------------------------------------- 1. plan
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@v4

      - name: Split reels.txt into chunks
        id: plan
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, math, os, sys
          size = max(1, int(os.environ["CHUNK_SIZE"]))
          if not os.path.exists("reels.txt"):
              sys.exit("reels.txt not found in the repo root")
          links = [l.strip() for l in open("reels.txt", encoding="utf-8-sig")
                   if l.strip() and not l.strip().startswith("#")]
          if not links:
              sys.exit("reels.txt has no links")
          chunks = list(range(math.ceil(len(links) / size)))
          print("matrix=" + json.dumps({"chunk": chunks}))
          print(f"total={len(links)}")
          EOF
          cat "$GITHUB_OUTPUT"

  # ---------------------------------------------------- 2. transcribe (parallel)
  transcribe:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false                      # one bad chunk never stops the others
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Show this machine, and add 8 GB swap
        run: |
          echo "CPUs: $(nproc)"
          lscpu | grep -m1 'Model name' || true
          free -h
          # swap = overflow memory on disk, so a big model slows down instead of being killed
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h | grep -i -E 'mem|swap'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and tesseract (English + Hindi)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin

      - name: Install yt-dlp (latest, with browser impersonation)
        run: |
          python -m pip install -U "yt-dlp[default,curl-cffi]"
          mkdir -p ~/.config/yt-dlp
          cat > ~/.config/yt-dlp/config <<'EOF'
          --impersonate chrome
          --retries 5
          --extractor-retries 3
          --sleep-requests 1
          --sleep-interval 3
          --max-sleep-interval 8
          EOF
          yt-dlp --version

      # ---- whisper-cli (built once, then cached) ----
      - name: Restore whisper-cli cache
        id: cli-cache
        uses: actions/cache/restore@v4
        with:
          path: whisper.cpp/build/bin/whisper-cli
          key: whisper-cli-v2-${{ runner.os }}-${{ env.WHISPER_CPP_REF }}

      - name: Build whisper-cli
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP_REF" https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp
          # portable build: no CPU-specific instructions, so it runs on any GitHub machine
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
          cmake --build build -j"$(nproc)" --config Release --target whisper-cli

      - name: Save whisper-cli cache
        if: steps.cli-cache.outputs.cache-hit != 'true'
        continue-on-error: true             # several chunks may try at once; harmless
        uses: actions/cache/save@v4
        with:
          path: whisper.cpp/build/bin/whisper-cli
          key: whisper-cli-v2-${{ runner.os }}-${{ env.WHISPER_CPP_REF }}

      - name: Put whisper-cli on PATH
        run: |
          echo "$GITHUB_WORKSPACE/whisper.cpp/build/bin" >> "$GITHUB_PATH"

      # ---- whisper model (downloaded once, then cached) ----
      - name: Restore model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/whisper
          key: whisper-model-${{ env.WHISPER_MODEL }}

      - name: Download whisper model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/whisper
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ~/.cache/whisper/${WHISPER_MODEL}.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/${WHISPER_MODEL}.bin
          ls -lh ~/.cache/whisper

      - name: Save model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/whisper
          key: whisper-model-${{ env.WHISPER_MODEL }}

      # ---- this job's slice of reels.txt ----
      - name: Pick this job's reels
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          python3 - <<'EOF'
          import os
          size = int(os.environ["CHUNK_SIZE"]); chunk = int(os.environ["CHUNK"])
          links = [l.strip() for l in open("reels.txt", encoding="utf-8-sig")
                   if l.strip() and not l.strip().startswith("#")]
          part = links[chunk * size:(chunk + 1) * size]
          open("chunk.txt", "w", encoding="utf-8").write("\n".join(part) + "\n")
          print(f"chunk {chunk}: reels {chunk * size + 1}-{chunk * size + len(part)} of {len(links)}")
          EOF

      - name: Transcribe this chunk
        env:
          CHUNK: ${{ matrix.chunk }}
          TOTAL: ${{ needs.plan.outputs.total }}
        run: |
          mkdir -p parts
          python insta.py chunk.txt -o "parts/part-$(printf '%04d' "$CHUNK").txt" \
            --offset "$((CHUNK * CHUNK_SIZE))" --total "$TOTAL" --no-header \
            --model "$HOME/.cache/whisper/${WHISPER_MODEL}.bin" \
            --threads "$(nproc)" --workers "$(nproc)"

      - name: If it failed - was the machine out of memory?
        if: failure()
        continue-on-error: true
        run: |
          free -h
          sudo dmesg | grep -i -E 'out of memory|killed process' | tail -5 || true

      # runs even if the job is cancelled/timed out, so finished reels are never lost
      - name: Upload this chunk's result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk }}
          path: parts/
          retention-days: 3
          if-no-files-found: ignore

  # -------------------------------------------------------------- 3. merge
  merge:
    needs: [plan, transcribe]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOTAL: ${{ needs.plan.outputs.total }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download all chunk results
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: parts

      - name: Join the chunks into one file
        run: |
          shopt -s nullglob
          files=(parts/part-*.txt)
          [ ${#files[@]} -gt 0 ] || { echo "No results were produced"; exit 1; }
          {
            echo "Transcripts generated $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Model: $WHISPER_MODEL   Source list: reels.txt   Videos: $TOTAL"
            echo
            cat "${files[@]}"
          } > "$OUTPUT_FILE"

          done_count=$(grep -c '^STATUS:' "$OUTPUT_FILE" || true)
          failed=$(grep -c '^STATUS: FAILED' "$OUTPUT_FILE" || true)
          missing=$((TOTAL - done_count))
          echo "$((done_count - failed)) ok, $failed failed, $missing missing (of $TOTAL)"

          {
            echo "### $((done_count - failed)) ok, $failed failed, $missing missing (of $TOTAL reels)"
            if [ "$failed" -gt 0 ]; then
              echo
              echo "Failed links (paste them into reels.txt to try again):"
              echo '```'
              awk '/^\[[0-9]+\] /{u=$2} /^STATUS: FAILED/{print u}' "$OUTPUT_FILE"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed of $TOTAL reels failed to download or process - see the run summary"
          fi
          if [ "$missing" -gt 0 ]; then
            echo "::warning::$missing reels have no result (a chunk job failed or timed out)"
          fi

      - name: Commit the transcription to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_FILE"
          if git diff --cached --quiet; then
            echo "$OUTPUT_FILE unchanged - nothing to commit"
          else
            git commit -m "Update $OUTPUT_FILE"
            git pull --rebase origin main
            git push origin HEAD:main
          fi