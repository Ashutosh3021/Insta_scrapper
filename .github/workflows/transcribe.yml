# Save this file in your repo as:  .github/workflows/transcribe.yml
#
# What it does: whenever reels.txt changes on main (or you press "Run workflow"),
# it transcribes every link in reels.txt (spoken words + on-screen text) with
# insta.py and commits the result to main as transcription_<model name>.txt
# (for example transcription_ggml-large-v3.txt).
# No login / cookies are used.

name: Transcribe reels

on:
  push:
    branches: [main]
    paths: [reels.txt]
  workflow_dispatch:
    inputs:
      model:
        description: Whisper model (large-v3 = best accuracy, turbo = much faster)
        type: choice
        default: ggml-large-v3
        options:
          - ggml-large-v3
          - ggml-large-v3-turbo

permissions:
  contents: write

# one run at a time, so two runs never fight over the output file
concurrency:
  group: transcribe
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest        # for your own PC's internet connection see "self-hosted" in the notes
    timeout-minutes: 360
    env:
      WHISPER_MODEL: ${{ inputs.model || 'ggml-large-v3' }}
      OUTPUT_FILE: transcription_${{ inputs.model || 'ggml-large-v3' }}.txt
      WHISPER_CPP_REF: v1.7.5

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and tesseract (English + Hindi)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin

      - name: Install yt-dlp (latest, with browser impersonation)
        run: |
          python -m pip install -U "yt-dlp[default,curl-cffi]"
          mkdir -p ~/.config/yt-dlp
          cat > ~/.config/yt-dlp/config <<'EOF'
          --impersonate chrome
          --retries 5
          --extractor-retries 3
          --sleep-requests 1
          --sleep-interval 3
          --max-sleep-interval 8
          EOF
          yt-dlp --version
          yt-dlp --list-impersonate-targets || true

      # ---- whisper-cli (built once, then cached) ----
      - name: Restore whisper-cli cache
        id: cli-cache
        uses: actions/cache/restore@v4
        with:
          path: whisper.cpp/build/bin/whisper-cli
          key: whisper-cli-${{ runner.os }}-${{ env.WHISPER_CPP_REF }}

      - name: Build whisper-cli
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP_REF" https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" --config Release --target whisper-cli

      - name: Save whisper-cli cache
        if: steps.cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: whisper.cpp/build/bin/whisper-cli
          key: whisper-cli-${{ runner.os }}-${{ env.WHISPER_CPP_REF }}

      - name: Put whisper-cli on PATH
        run: |
          echo "$GITHUB_WORKSPACE/whisper.cpp/build/bin" >> "$GITHUB_PATH"

      # ---- whisper model (downloaded once, then cached) ----
      - name: Restore model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/whisper
          key: whisper-model-${{ env.WHISPER_MODEL }}

      - name: Download whisper model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/whisper
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ~/.cache/whisper/${WHISPER_MODEL}.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/${WHISPER_MODEL}.bin
          ls -lh ~/.cache/whisper

      - name: Save model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/whisper
          key: whisper-model-${{ env.WHISPER_MODEL }}

      # ---- the actual work ----
      - name: Transcribe reels.txt
        run: |
          test -f reels.txt || { echo "reels.txt not found in the repo root"; exit 1; }
          python insta.py reels.txt -o "$OUTPUT_FILE" \
            --model "$HOME/.cache/whisper/${WHISPER_MODEL}.bin" \
            --threads "$(nproc)" --workers "$(nproc)"

      - name: Commit the transcription to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_FILE"
          if git diff --cached --quiet; then
            echo "$OUTPUT_FILE unchanged - nothing to commit"
          else
            git commit -m "Update $OUTPUT_FILE"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Report failed reels
        run: |
          total=$(grep -c '^STATUS:' "$OUTPUT_FILE" || true)
          failed=$(grep -c '^STATUS: FAILED' "$OUTPUT_FILE" || true)
          echo "$failed of $total reels failed"
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed of $total reels failed to download or process - see $OUTPUT_FILE"
          fi
          if [ "$total" -gt 0 ] && [ "$failed" -eq "$total" ]; then
            exit 1
          fi